<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="542" viewBox="0 0 1130 542" role="img" aria-labelledby="title desc">
<title id="title">Failures changed the shape of the theory</title><desc id="desc">The arrows distinguish a failed proposal, its exact counterexample, and the revised scope. Discovery history is not a logical proof dependency.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8a948f"/></marker></defs>
<rect width="100%" height="100%" fill="#fafaf6"/>
<text x="24" y="25" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#21372f">Failures changed the shape of the theory</text>
<path d="M516,355.0 C546,355.0 538,225.0 568,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>motivates: The failed first-order boundary was replaced by exact global envelope analysis.</title></path>
<text x="542.0" y="286.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">motivates</text>
<path d="M788,225.0 C818,225.0 810,160.0 840,160.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>supports: The exact entropy image can have exactly two finite values.</title></path>
<text x="814.0" y="188.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">supports</text>
<path d="M788,355.0 C818,355.0 810,160.0 840,160.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>supports: The local observed-law envelope can nevertheless be unbounded.</title></path>
<text x="814.0" y="253.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">supports</text>
<path d="M296,95.0 C270.0,95.0 270.0,95.0 244,95.0" fill="none" stroke="#b44844" stroke-width="1.2" marker-end="url(#arrow)"><title>falsifies: The exact witness defeats the rejected statement under its own claimed scope; the corrected scope is preserved in the witness.</title></path>
<text x="270.0" y="91.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">falsifies</text>
<path d="M296,225.0 C270.0,225.0 270.0,225.0 244,225.0" fill="none" stroke="#b44844" stroke-width="1.2" marker-end="url(#arrow)"><title>falsifies: The exact witness defeats the rejected statement under its own claimed scope; the corrected scope is preserved in the witness.</title></path>
<text x="270.0" y="221.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">falsifies</text>
<path d="M296,355.0 C270.0,355.0 270.0,355.0 244,355.0" fill="none" stroke="#b44844" stroke-width="1.2" marker-end="url(#arrow)"><title>falsifies: The exact witness defeats the rejected statement under its own claimed scope; the corrected scope is preserved in the witness.</title></path>
<text x="270.0" y="351.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">falsifies</text>
<path d="M678.0,144 L678.0,176" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>supports: This recorded proof, calculation or provenance check supports only its explicitly stated scope.</title></path>
<text x="682.0" y="156.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">supports</text>
<path d="M788,355.0 C818,355.0 810,160.0 840,160.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>generalizes: The fixed-count criterion separates positive triangles from all N≥4 sources.</title></path>
<text x="814.0" y="253.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">generalizes</text>
<path d="M516,225.0 C546,225.0 538,225.0 568,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>motivates: Whole-support exhaustion is needed to count a fiber.</title></path>
<text x="542.0" y="221.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">motivates</text>
<path d="M568,225.0 C406.0,225.0 406.0,355.0 244,355.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>revises: The sharp endpoint is a different quartic root and is established globally.</title></path>
<text x="406.0" y="286.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">revises</text>
<g><title>Every linearly minimal compatible realization has unique entropy.</title><rect x="24" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="46" width="4" height="98" rx="2" fill="#b44844"/>
<text x="37" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#b44844">FALSIFIED</text>
<text x="37" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Rejected: minimality</text>
<text x="37" y="106" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">restores thermodynamic</text>
<text x="37" y="124" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">uniqueness</text>
</g>
<g><title>A locally isolated physical generator is the only compatible generator.</title><rect x="24" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="176" width="4" height="98" rx="2" fill="#b44844"/>
<text x="37" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#b44844">FALSIFIED</text>
<text x="37" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Rejected: local isolation</text>
<text x="37" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">proves global uniqueness</text>
</g>
<g><title>No connected hidden realization exists at or above zc=(11+sqrt(1120/11))/2.</title><rect x="24" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="306" width="4" height="98" rx="2" fill="#b44844"/>
<text x="37" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#b44844">FALSIFIED</text>
<text x="37" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Rejected: the first-order</text>
<text x="37" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">opening threshold is sharp</text>
</g>
<g><title>The symmetric complete four-state Q0 has entropy zero and full linear order four. At ε=1/4 the exact normalized hidden similarity gives Q=[[-6,1,3/2,7/2],[1,-10,3,6],[5/3,11/3,-29/4,23/12],[3,5,3/4,-35/4]], with the same all-time kernel and σ=(1/16)log(529/154)&gt;0; ε→2/3 produces unbounded entropy.</title><rect x="296" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="46" width="4" height="98" rx="2" fill="#b44844"/>
<text x="309" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#b44844">PROVED</text>
<text x="309" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Minimal four-state</text>
<text x="309" y="106" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">ambiguity</text>
</g>
<g><title>Theta(3,3) is actually isolated by an exact positive tangent dual and nonsingular chart, yet U=(1/1000)[[871,-390,519],[623,790,-413],[-183,133,1050]] yields a distant complete generator with the same kernel. det U=34813/31250 and its minimum offdiagonal rate is 139/500; a further exact family has divergent entropy.</title><rect x="296" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="176" width="4" height="98" rx="2" fill="#b44844"/>
<text x="309" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#b44844">PROVED</text>
<text x="309" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">An isolated model with a</text>
<text x="309" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">distant alternative</text>
</g>
<g><title>A fixed exact rational normalized similarity gives complete generators for every z in [2109/200,21091/2000]=[10.545,10.5455], an interval crossing zc≈10.5452497911. Every offdiagonal is strictly positive and the full kernel is preserved.</title><rect x="296" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="306" width="4" height="98" rx="2" fill="#b44844"/>
<text x="309" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#b44844">PROVED</text>
<text x="309" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Exact witness beyond the</text>
<text x="309" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">local threshold</text>
</g>
<g><title>Every four-state exact entropy fiber is singleton or unbounded; unknown support has only two unique incidence classes.</title><rect x="568" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="46" width="4" height="98" rx="2" fill="#157763"/>
<text x="581" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="581" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Legacy · Complete four-</text>
<text x="581" y="106" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">state entropy dichotomies</text>
</g>
<g><title>The balanced theta family has unbounded, two-point, then singleton entropy fibers across an exact quartic threshold.</title><rect x="568" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="176" width="4" height="98" rx="2" fill="#157763"/>
<text x="581" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="581" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Five-state boundary:</text>
<text x="581" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">exactly two entropy values</text>
</g>
<g><title>For one resolved pair, a finite local entropy ceiling exists exactly at N=2 or a complete N=3 triangle.</title><rect x="568" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="306" width="4" height="98" rx="2" fill="#157763"/>
<text x="581" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="581" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Local ceiling iff N=2 or</text>
<text x="581" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">complete N=3</text>
</g>
<g><title>Sparse supports can have exact recovery but unbounded entropy nearby. Complete sources instead have an exact coverage dichotomy: unique with at most one uncovered vertex, or an attainable entropy half-line with at least two.</title><rect x="840" y="111" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="840" y="111" width="4" height="98" rx="2" fill="#477296"/>
<text x="853" y="129" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#477296">INTERPRETATION</text>
<text x="853" y="153" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Exact ambiguity and</text>
<text x="853" y="171" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">observational instability</text>
<text x="853" y="189" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">are different</text>
</g>
<g><title>Complete finite-frequency primary comparison, integrate the new proof package into the article, then study conditioning-aware observation design.</title><rect x="840" y="241" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="840" y="241" width="4" height="98" rx="2" fill="#526357"/>
<text x="853" y="259" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#526357">INTERPRETATION</text>
<text x="853" y="283" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Next: attribution and</text>
<text x="853" y="301" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">conditioning</text>
</g>
<text x="24" y="472" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#51635b">Proof, numerical checks and novelty have separate statuses. Arrows use the relations in graph.json.</text>
<text x="24" y="493" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#51635b">Interactive companion: select a node to read assumptions, typed relationships and exact provenance.</text></svg>