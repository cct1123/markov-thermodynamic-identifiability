<g><title>Observed-state semigroups identify combinatorially symmetric CTMCs when covered vertices form a zero-forcing set; all but one vertices suffice.</title><rect x="24" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="46" width="4" height="98" rx="2" fill="#7b629b"/>
<text x="37" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#7b629b">KNOWN PRIOR RESULT</text>
<text x="37" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Burgarth: zero forcing</text>
<text x="37" y="106" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">identifies Markov</text>
<text x="37" y="124" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">generators</text>
</g>
<g><title>Normalized similarities and positivity constraints describe complete same-order realization sets under the relevant minimality assumptions; their semialgebraicity is established.</title><rect x="24" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="176" width="4" height="98" rx="2" fill="#7b629b"/>
