<text x="309" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Complete sources: unique or</text>
<text x="309" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">an exact entropy half-line</text>
</g>
<g><title>A sharp local criterion now covers every reverse-closed resolved observation set.</title><rect x="296" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="306" width="4" height="98" rx="2" fill="#157763"/>
