<text x="37" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Positive-model equivalence</text>
<text x="37" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">is established machinery</text>
</g>
<g><title>Aggregated CTMCs can share observations while differing in detailed balance; discrete-time masked models already show broad entropy variation and sampled growth near one-way boundaries.</title><rect x="24" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="306" width="4" height="98" rx="2" fill="#7b629b"/>
<text x="37" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#7b629b">KNOWN PRIOR RESULT</text>
<text x="37" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Hidden equilibrium and</text>
<text x="37" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">nonequilibrium ambiguity is</text>
<text x="37" y="384" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">established</text>
</g>
<g><title>The balanced theta family has unbounded, two-point, then singleton entropy fibers across an exact quartic threshold.</title><rect x="296" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="46" width="4" height="98" rx="2" fill="#157763"/>
<text x="309" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="309" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Five-state boundary:</text>
<text x="309" y="106" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">exactly two entropy values</text>
</g>
<g><title>At most one uncovered vertex gives uniqueness; two or more give an exact attainable entropy half-line.</title><rect x="296" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="176" width="4" height="98" rx="2" fill="#157763"/>
