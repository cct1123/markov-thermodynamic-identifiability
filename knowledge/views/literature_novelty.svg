<text x="581" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Resolved waiting-time</text>
<text x="581" y="106" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">thermodynamic inference is</text>
<text x="581" y="124" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">established</text>
</g>
<g><title>Vanishing reverse rates can cause logarithmic entropy divergence; arbitrarily small total variation can coexist with arbitrarily large KL divergence.</title><rect x="568" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="176" width="4" height="98" rx="2" fill="#7b629b"/>
<text x="581" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#7b629b">KNOWN PRIOR RESULT</text>
<text x="581" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Small TV does not upper-</text>
<text x="581" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">bound relative entropy</text>
</g>
<g><title>Converging experiment laws with diverging parameter size force uniformly valid confidence sets or upper limits to become unbounded.</title><rect x="568" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="306" width="4" height="98" rx="2" fill="#7b629b"/>
