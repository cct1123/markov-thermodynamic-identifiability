<text x="581" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Uniform upper-limit</text>
<text x="581" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">impossibility has</text>
<text x="581" y="384" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">statistical precedent</text>
</g>
<g><title>The candidate contribution now combines the support-exhaustive five-state fiber with an arbitrary-observation exact complete-source dichotomy, sharp local ceilings and finite-measurement/design consequences.</title><rect x="840" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="840" y="46" width="4" height="98" rx="2" fill="#526357"/>
