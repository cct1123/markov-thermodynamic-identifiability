<text x="309" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Local ceiling iff complete</text>
<text x="309" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">and at most one uncovered</text>
</g>
<g><title>Resolved transition-conditioned kernels support lower entropy estimators, observed-rate recovery and hidden-path constraints.</title><rect x="568" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="46" width="4" height="98" rx="2" fill="#7b629b"/>
