<text x="309" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Positive triangles: locally</text>
<text x="309" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Lipschitz entropy</text>
</g>
<g><title>For one resolved pair, a finite local entropy ceiling exists exactly at N=2 or a complete N=3 triangle.</title><rect x="296" y="436" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="436" width="4" height="98" rx="2" fill="#157763"/>
