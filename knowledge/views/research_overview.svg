<text x="581" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">observational instability</text>
<text x="581" y="254" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">are different</text>
