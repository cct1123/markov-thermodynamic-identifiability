<text x="309" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Identified three-state</text>
<text x="309" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">rates; divergent entropy</text>
<text x="309" y="254" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">nearby</text>
</g>
<g><title>A strictly positive three-state triangle has locally Lipschitz entropy in row TV.</title><rect x="296" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="306" width="4" height="98" rx="2" fill="#157763"/>
