<title id="title">How much dissipation can remain hidden?</title><desc id="desc">One resolved transition pair leads to two inverse questions: what exact data identify, and whether any nonzero tolerance permits a finite upper bound.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8a948f"/></marker></defs>
<rect width="100%" height="100%" fill="#fafaf6"/>
<text x="24" y="25" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#21372f">How much dissipation can remain hidden?</text>
<path d="M134.0,209 L134.0,241" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>uses_method: Specify precisely what the observer measures.</title></path>
<path d="M134.0,209 L134.0,371" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>motivates: The objective is the entropy image of every compatible physical model.</title></path>
<path d="M516,95.0 C546,95.0 538,225.0 568,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>supports: The exact entropy image can have exactly two finite values.</title></path>
<path d="M516,485.0 C546,485.0 538,225.0 568,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>supports: The local observed-law envelope can nevertheless be unbounded.</title></path>
<path d="M516,95.0 C546,95.0 538,355.0 568,355.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>supports: Exhaustive physical count and entropy separation are the first central candidate contribution.</title></path>
<path d="M516,485.0 C546,485.0 538,355.0 568,355.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>supports: The all-N local-ceiling criterion is the companion candidate contribution.</title></path>
<path d="M840,160.0 C814.0,160.0 814.0,355.0 788,355.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: Readiness and plausible originality remain bounded by source coverage.</title></path>
<path d="M840,290.0 C814.0,290.0 814.0,355.0 788,355.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: The conventional global proof must remain transparent and challengeable.</title></path>
<path d="M788,355.0 C818,355.0 810,420.0 840,420.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>motivates: The accepted publication case justifies assembling the proof-first manuscript core.</title></path>
<path d="M950.0,209 L950.0,371" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: Attach exact primary comparisons and retain gaps; do not claim novelty from failed searches.</title></path>
<path d="M950.0,339 L950.0,371" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>motivates: A reader must be able to audit connected/disconnected supports and certificates.</title></path>
<path d="M406.0,404 L406.0,436" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>supports: This recorded proof, calculation or provenance check supports only its explicitly stated scope.</title></path>
<path d="M244,420.0 C274,420.0 266,95.0 296,95.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>motivates: Classify the complete entropy image, including bounded finite ambiguity.</title></path>
<path d="M516,225.0 C546,225.0 538,225.0 568,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>supports: Even an exactly unique and stably recovered generator need not give stable entropy.</title></path>
<path d="M516,355.0 C546,355.0 538,225.0 568,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: Positive three-state triangles provide a local stable exception.</title></path>
<path d="M516,485.0 C546,485.0 538,225.0 568,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>generalizes: The fixed-count criterion separates positive triangles from all N≥4 sources.</title></path>
<path d="M678.0,274 L678.0,306" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>supports: Exact identified sets and their local upper stability answer complementary physical questions.</title></path>
<path d="M788,355.0 C818,355.0 810,420.0 840,420.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>next_action: Prepare the already saved self-contained proof core; no new broad exploration is needed for this scoped manuscript.</title></path>
<g><title>Determine the full range of microscopic steady-state entropy production compatible with exact transition-to-transition observations.</title><rect x="24" y="111" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="111" width="4" height="98" rx="2" fill="#477296"/>
