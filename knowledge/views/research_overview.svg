<text x="309" y="478" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Local ceiling iff N=2 or</text>
<text x="309" y="496" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">complete N=3</text>
</g>
<g><title>A source can have one or two exact entropy values while every positive observation tolerance admits arbitrarily large entropy.</title><rect x="568" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="176" width="4" height="98" rx="2" fill="#477296"/>
