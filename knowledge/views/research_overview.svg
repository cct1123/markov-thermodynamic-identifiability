<text x="309" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Five-state boundary:</text>
<text x="309" y="106" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">exactly two entropy values</text>
</g>
<g><title>A uniquely identified minimal-three-state tree is approached by same-trace, rate-bounded triangles with divergent entropy.</title><rect x="296" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="176" width="4" height="98" rx="2" fill="#157763"/>
