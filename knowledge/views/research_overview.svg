</g>
<g><title>Project a compatible generator fiber through the entropy functional.</title><rect x="24" y="371" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="371" width="4" height="98" rx="2" fill="#477296"/>
