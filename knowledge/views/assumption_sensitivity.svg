<rect width="100%" height="100%" fill="#fafaf6"/>
<text x="24" y="25" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#21372f">Changing the model class changes the answer</text>
<path d="M568,420.0 C542.0,420.0 542.0,160.0 516,160.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: A sixth nonminimal state changes the endpoint&#x27;s entropy fiber from two-point to unbounded.</title></path>
<text x="542.0" y="286.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">limits</text>
<path d="M244,355.0 C274,355.0 266,420.0 296,420.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: An arbitrary extra tight cap can reduce the entire class to a singleton, so it is not implicit in the iff theorem.</title></path>
<text x="270.0" y="383.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">limits</text>
