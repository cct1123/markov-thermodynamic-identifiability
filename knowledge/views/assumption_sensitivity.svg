<text x="270.0" y="383.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">supports</text>
<g><title>Source and competitors have the same specified state count N.</title><rect x="24" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="46" width="4" height="98" rx="2" fill="#9b7431"/>
<text x="37" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#9b7431">ASSUMPTION</text>
<text x="37" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Exactly N states</text>
</g>
<g><title>Competitors have at most five states for the balanced-theta result.</title><rect x="24" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="176" width="4" height="98" rx="2" fill="#9b7431"/>
<text x="37" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#9b7431">ASSUMPTION</text>
<text x="37" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Five-state cap</text>
</g>
<g><title>Every offdiagonal rate satisfies q_ij≤M for a prescribed finite M.</title><rect x="24" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="306" width="4" height="98" rx="2" fill="#9b7431"/>
<text x="37" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#9b7431">ASSUMPTION</text>
<text x="37" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Common upper rate bound</text>
</g>
<g><title>All six offdiagonal rates of the three-state source are positive.</title><rect x="24" y="436" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="436" width="4" height="98" rx="2" fill="#9b7431"/>
<text x="37" y="454" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#9b7431">ASSUMPTION</text>
<text x="37" y="478" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Strictly positive triangle</text>
</g>
<g><title>The balanced theta family has unbounded, two-point, then singleton entropy fibers across an exact quartic threshold.</title><rect x="296" y="111" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="111" width="4" height="98" rx="2" fill="#157763"/>
<text x="309" y="129" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="309" y="153" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Five-state boundary:</text>
<text x="309" y="171" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">exactly two entropy values</text>
</g>
<g><title>A strictly positive three-state triangle has locally Lipschitz entropy in row TV.</title><rect x="296" y="241" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="241" width="4" height="98" rx="2" fill="#157763"/>
<text x="309" y="259" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="309" y="283" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Positive triangles: locally</text>
<text x="309" y="301" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Lipschitz entropy</text>
</g>
<g><title>For one resolved pair, a finite local entropy ceiling exists exactly at N=2 or a complete N=3 triangle.</title><rect x="296" y="371" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="371" width="4" height="98" rx="2" fill="#157763"/>
<text x="309" y="389" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="309" y="413" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Local ceiling iff N=2 or</text>
<text x="309" y="431" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">complete N=3</text>
</g>
<g><title>For N=4, fixed trace -12 and all twelve offdiagonal rates ≤1 force every rate to equal one. The restricted class is a singleton with zero entropy, despite two fully hidden states for one observed pair.</title><rect x="568" y="111" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="111" width="4" height="98" rx="2" fill="#b44844"/>
<text x="581" y="129" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#b44844">PROVED</text>
<text x="581" y="153" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">A tight cap freezes the</text>
<text x="581" y="171" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">four-state class</text>
</g>
<g><title>The unit three-state tree is approached by Q(e,k)=[[-1-e,1,e],[1,-2+k,1-k],[k,1-e,-1+e-k]], 0&lt;k&lt;e&lt;1/2. Every model is uniquely identified at cap three and has trace -4, rates ≤1 and minimal order three. With k=exp(-1/e²), Q→Q0 but eσ→1/3.</title><rect x="568" y="241" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="241" width="4" height="98" rx="2" fill="#b44844"/>
<text x="581" y="259" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#b44844">PROVED</text>
<text x="581" y="283" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Identified rates; divergent</text>
<text x="581" y="301" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">entropy</text>
</g>
<g><title>Splitting one fully hidden state preserves all kernels but permits unbounded entropy on N+1 states.</title><rect x="568" y="371" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="371" width="4" height="98" rx="2" fill="#157763"/>
<text x="581" y="389" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="581" y="413" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Legacy · One spare hidden</text>
<text x="581" y="431" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">state makes entropy</text>
<text x="581" y="449" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">unbounded</text>
</g>
<text x="24" y="602" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#51635b">Proof, numerical checks and novelty have separate statuses. Arrows use the relations in graph.json.</text>
