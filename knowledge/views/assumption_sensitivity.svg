<path d="M296,420.0 C270.0,420.0 270.0,95.0 244,95.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>assumes: Retained statement scope, not a universal necessity assertion. This is an explicitly listed condition of this statement; its necessity or weakening is explained in the claim and assumption panels.</title></path>
<text x="270.0" y="253.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">assumes</text>
<path d="M406.0,339 L406.0,371" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>supports: This recorded proof, calculation or provenance check supports only its explicitly stated scope.</title></path>
<text x="410.0" y="351.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">supports</text>
<path d="M568,160.0 C406.0,160.0 406.0,355.0 244,355.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: The negative fixed-trace theorem does not tolerate every arbitrary extra tight cap.</title></path>
<text x="406.0" y="253.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">limits</text>
