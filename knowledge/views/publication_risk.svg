<svg xmlns="http://www.w3.org/2000/svg" width="1402" height="542" viewBox="0 0 1402 542" role="img" aria-labelledby="title desc">
<title id="title">A skeptical view of the publication case</title><desc id="desc">The main risk is not a recorded contradictory result. It is an omitted physical support, an incorrectly transferred assumption, or a genuinely matching prior theorem.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8a948f"/></marker></defs>
<rect width="100%" height="100%" fill="#fafaf6"/>
<text x="24" y="25" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#21372f">A skeptical view of the publication case</text>
<path d="M568,225.0 C406.0,225.0 406.0,225.0 244,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: Readiness and plausible originality remain bounded by source coverage.</title></path>
<text x="406.0" y="221.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">limits</text>
<path d="M568,95.0 C406.0,95.0 406.0,225.0 244,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: The conventional global proof must remain transparent and challengeable.</title></path>
<text x="406.0" y="156.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">limits</text>
<path d="M244,225.0 C678.0,225.0 678.0,225.0 1112,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>motivates: The accepted publication case justifies assembling the proof-first manuscript core.</title></path>
<text x="678.0" y="221.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">motivates</text>
<path d="M788,225.0 C950.0,225.0 950.0,225.0 1112,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: Attach exact primary comparisons and retain gaps; do not claim novelty from failed searches.</title></path>
<text x="950.0" y="221.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">limits</text>
<path d="M788,95.0 C950.0,95.0 950.0,225.0 1112,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>motivates: A reader must be able to audit connected/disconnected supports and certificates.</title></path>
<text x="950.0" y="156.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">motivates</text>
<path d="M244,225.0 C678.0,225.0 678.0,225.0 1112,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>next_action: Prepare the already saved self-contained proof core; no new broad exploration is needed for this scoped manuscript.</title></path>
<text x="678.0" y="221.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">next action</text>
<path d="M950.0,274 L950.0,306" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>verified_by: Independent exact computations and conventional scope review support the witness.</title></path>
<text x="954.0" y="286.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">verified by</text>
<path d="M244,225.0 C406.0,225.0 406.0,355.0 568,355.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>requires_review: Detailed original-source comparison can change attribution without changing the proved algebra.</title></path>
<text x="406.0" y="286.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">requires review</text>
<path d="M840,95.0 C814.0,95.0 814.0,225.0 788,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: Bare all-time one-hidden recovery cannot be treated as the principal novel claim.</title></path>
<text x="814.0" y="156.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">limits</text>
<g><title>The candidate contribution now combines the support-exhaustive five-state fiber with an arbitrary-observation exact complete-source dichotomy, sharp local ceilings and finite-measurement/design consequences.</title><rect x="24" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="176" width="4" height="98" rx="2" fill="#526357"/>
<text x="37" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#526357">INTERPRETATION</text>
<text x="37" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Candidate manuscript</text>
<text x="37" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">contribution</text>
</g>
<g><title>Source and competitors have the same specified state count N.</title><rect x="296" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="46" width="4" height="98" rx="2" fill="#9b7431"/>
<text x="309" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#9b7431">ASSUMPTION</text>
<text x="309" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Exactly N states</text>
</g>
<g><title>A nonempty reverse-closed set of individually resolved transitions is specified.</title><rect x="296" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="176" width="4" height="98" rx="2" fill="#9b7431"/>
<text x="309" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#9b7431">ASSUMPTION</text>
<text x="309" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Resolved reverse-closed</text>
<text x="309" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">marks</text>
</g>
<g><title>Every connected reciprocal support allowed by the declared state count is admissible.</title><rect x="296" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="306" width="4" height="98" rx="2" fill="#9b7431"/>
<text x="309" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#9b7431">ASSUMPTION</text>
<text x="309" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Unknown competitor topology</text>
</g>
<g><title>The endpoint count rests on a long conventional proof covering connected and disconnected hidden supports, all envelope equality cases, endpoint existence and entropy separation.</title><rect x="568" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="46" width="4" height="98" rx="2" fill="#987325"/>
<text x="581" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#987325">INTERPRETATION</text>
<text x="581" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Global support exhaustion</text>
<text x="581" y="106" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">must remain auditable</text>
</g>
<g><title>Burgarth substantially anticipates bare all-time one-hidden recovery. The precise coverage/entropy classification is differentiated by the bounded audit; priority against finite-frequency and other named source gaps remains open.</title><rect x="568" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="176" width="4" height="98" rx="2" fill="#987325"/>
<text x="581" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#987325">UNRESOLVED</text>
<text x="581" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">A matching prior physical</text>
<text x="581" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">theorem could change</text>
<text x="581" y="254" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">attribution</text>
</g>
<g><title>Loewner/generalized realization is close prior work; abstract-level access does not decide overlap with this physical two/three-point inverse.</title><rect x="568" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="306" width="4" height="98" rx="2" fill="#987325"/>
<text x="581" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#987325">UNRESOLVED</text>
<text x="581" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Finite-frequency priority</text>
<text x="581" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">comparison remains</text>
<text x="581" y="384" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">incomplete</text>
</g>
<g><title>Observed-state semigroups identify combinatorially symmetric CTMCs when covered vertices form a zero-forcing set; all but one vertices suffice.</title><rect x="840" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="840" y="46" width="4" height="98" rx="2" fill="#7b629b"/>
<text x="853" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#7b629b">KNOWN PRIOR RESULT</text>
<text x="853" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Burgarth: zero forcing</text>
<text x="853" y="106" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">identifies Markov</text>
<text x="853" y="124" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">generators</text>
</g>
<g><title>A sparse connected source with all supported rates observed becomes a singleton when those rates and trace are fixed.</title><rect x="840" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="840" y="176" width="4" height="98" rx="2" fill="#b44844"/>
<text x="853" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#b44844">PROVED</text>
<text x="853" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Zero unobserved rate slack</text>
<text x="853" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">freezes the calibrated</text>
<text x="853" y="254" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">class</text>
</g>
<g><title>Separate inverse derivations, final-draft referee audit, full-mark entropy witness, equal-row lumping and first internal shear boundary.</title><rect x="840" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="840" y="306" width="4" height="98" rx="2" fill="#577582"/>
<text x="853" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#577582">INDEPENDENT CHECK</text>
<text x="853" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Independent coverage proof</text>
<text x="853" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">and exact checks</text>
</g>
<g><title>Complete finite-frequency primary comparison, integrate the new proof package into the article, then study conditioning-aware observation design.</title><rect x="1112" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="1112" y="176" width="4" height="98" rx="2" fill="#526357"/>
<text x="1125" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#526357">INTERPRETATION</text>
<text x="1125" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Next: attribution and</text>
<text x="1125" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">conditioning</text>
</g>
<text x="24" y="472" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#51635b">Proof, numerical checks and novelty have separate statuses. Arrows use the relations in graph.json.</text>
