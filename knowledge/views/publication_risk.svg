<g><title>The narrow publication case is the exhaustive two-point physical entropy fiber and sharp balanced transition, together with the all-N resolved-pair local-ceiling criterion.</title><rect x="24" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="176" width="4" height="98" rx="2" fill="#526357"/>
<text x="37" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#526357">INTERPRETATION</text>
<text x="37" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Candidate manuscript</text>
<text x="37" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">contribution</text>
</g>
<g><title>Competitors have at most five states for the balanced-theta result.</title><rect x="296" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="46" width="4" height="98" rx="2" fill="#9b7431"/>
<text x="309" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#9b7431">ASSUMPTION</text>
<text x="309" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Five-state cap</text>
</g>
<g><title>Only x→y and y→x are individually observed, with known endpoints.</title><rect x="296" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="176" width="4" height="98" rx="2" fill="#9b7431"/>
<text x="309" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#9b7431">ASSUMPTION</text>
<text x="309" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">One known resolved pair</text>
</g>
<g><title>Every connected reciprocal support allowed by the declared state count is admissible.</title><rect x="296" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="306" width="4" height="98" rx="2" fill="#9b7431"/>
<text x="309" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#9b7431">ASSUMPTION</text>
<text x="309" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Unknown competitor topology</text>
</g>
<g><title>The endpoint count rests on a long conventional proof covering connected and disconnected hidden supports, all envelope equality cases, endpoint existence and entropy separation.</title><rect x="568" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="46" width="4" height="98" rx="2" fill="#987325"/>
<text x="581" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#987325">INTERPRETATION</text>
<text x="581" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Global support exhaustion</text>
<text x="581" y="106" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">must remain auditable</text>
</g>
<g><title>No inspected source was shown to imply the exact two-point physical entropy fiber or the complete fixed-N ceiling criterion; matching exceptional results in inaccessible originals remain a specific risk.</title><rect x="568" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="176" width="4" height="98" rx="2" fill="#987325"/>
<text x="581" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#987325">UNRESOLVED</text>
<text x="581" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">A matching prior physical</text>
<text x="581" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">theorem could change</text>
<text x="581" y="254" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">attribution</text>
</g>
<g><title>For N=4, fixed trace -12 and all twelve offdiagonal rates ≤1 force every rate to equal one. The restricted class is a singleton with zero entropy, despite two fully hidden states for one observed pair.</title><rect x="568" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="306" width="4" height="98" rx="2" fill="#b44844"/>
<text x="581" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#b44844">PROVED</text>
<text x="581" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">A tight cap freezes the</text>
<text x="581" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">four-state class</text>
</g>
<g><title>Minimality, two connectivity classes, exact feasibility and entropy separation form a complete proof.</title><rect x="840" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="840" y="46" width="4" height="98" rx="2" fill="#577582"/>
<text x="853" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#577582">PROVED</text>
<text x="853" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Global proof of the</text>
<text x="853" y="106" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">balanced fiber</text>
</g>
<g><title>Mond–Smith–van Straten give eight isolated full-space rank-three stochastic factorizations. The repository&#x27;s audited scalar-dynamics lift transfers this finiteness to minimal continuous-time positive realizations.</title><rect x="840" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="840" y="176" width="4" height="98" rx="2" fill="#7b629b"/>
<text x="853" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#7b629b">KNOWN PRIOR RESULT</text>
<text x="853" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Finite positive-realization</text>
<text x="853" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">fibers are known</text>
</g>
<g><title>The inspected abstract reports canonical aggregate representations under regularity conditions, but the original hypotheses and exceptional examples remain unread.</title><rect x="840" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="840" y="306" width="4" height="98" rx="2" fill="#7b629b"/>
<text x="853" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#7b629b">UNRESOLVED</text>
<text x="853" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Larget&#x27;s original theorem</text>
<text x="853" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">remains a specific access</text>
<text x="853" y="384" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">gap</text>
</g>
