<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="542" viewBox="0 0 1130 542" role="img" aria-labelledby="title desc">
<title id="title">Exact knowledge can still be thermodynamically fragile</title><desc id="desc">The current story connects exact inverse fibers to stability, without claiming that partial observation always produces ambiguity.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8a948f"/></marker></defs>
<rect width="100%" height="100%" fill="#fafaf6"/>
<text x="24" y="25" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#21372f">Exact knowledge can still be thermodynamically fragile</text>
<path d="M134.0,209 L134.0,241" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>uses_method: Specify precisely what the observer measures.</title></path>
<text x="138.0" y="221.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">uses method</text>
<path d="M244,160.0 C274,160.0 266,160.0 296,160.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>motivates: The objective is the entropy image of every compatible physical model.</title></path>
<text x="270.0" y="156.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">motivates</text>
<path d="M516,290.0 C678.0,290.0 678.0,160.0 840,160.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>supports: The exact entropy image can have exactly two finite values.</title></path>
<text x="678.0" y="221.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">supports</text>
<path d="M406.0,209 L406.0,241" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>motivates: Classify the complete entropy image, including bounded finite ambiguity.</title></path>
<text x="410.0" y="221.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">motivates</text>
<g><title>Determine the full range of microscopic steady-state entropy production compatible with exact transition-to-transition observations.</title><rect x="24" y="111" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="111" width="4" height="98" rx="2" fill="#477296"/>
<text x="37" y="129" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#477296">DEFINITION</text>
<text x="37" y="153" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">What can one visible edge</text>
<text x="37" y="171" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">reveal?</text>
</g>
<g><title>Each detected jump resets to a known endpoint; retain the next mark and its waiting time jointly.</title><rect x="24" y="241" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="241" width="4" height="98" rx="2" fill="#477296"/>
<text x="37" y="259" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#477296">DEFINITION</text>
<text x="37" y="283" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Observe the joint kernel</text>
<text x="37" y="301" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Ψ_Q(t)</text>
</g>
<g><title>Project a compatible generator fiber through the entropy functional.</title><rect x="296" y="111" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="111" width="4" height="98" rx="2" fill="#477296"/>
<text x="309" y="129" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#477296">DEFINITION</text>
<text x="309" y="153" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">All compatible entropy</text>
<text x="309" y="171" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">values S_C(D)</text>
</g>
<g><title>The balanced theta family has unbounded, two-point, then singleton entropy fibers across an exact quartic threshold.</title><rect x="296" y="241" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="241" width="4" height="98" rx="2" fill="#157763"/>
<text x="309" y="259" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="309" y="283" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Five-state boundary:</text>
<text x="309" y="301" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">exactly two entropy values</text>
</g>
<g><title>At most one uncovered vertex allows a locally rational inverse with no rate priors.</title><rect x="568" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="46" width="4" height="98" rx="2" fill="#157763"/>
<text x="581" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="581" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Coverage inverse: two or</text>
<text x="581" y="106" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">three positive transforms</text>
</g>
<g><title>At most one uncovered vertex gives uniqueness; two or more give an exact attainable entropy half-line.</title><rect x="568" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="176" width="4" height="98" rx="2" fill="#157763"/>
<text x="581" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="581" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Complete sources: unique or</text>
<text x="581" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">an exact entropy half-line</text>
</g>
<g><title>A sharp local criterion now covers every reverse-closed resolved observation set.</title><rect x="568" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="306" width="4" height="98" rx="2" fill="#157763"/>
<text x="581" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="581" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Local ceiling iff complete</text>
<text x="581" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">and at most one uncovered</text>
</g>
<g><title>Sparse supports can have exact recovery but unbounded entropy nearby. Complete sources instead have an exact coverage dichotomy: unique with at most one uncovered vertex, or an attainable entropy half-line with at least two.</title><rect x="840" y="111" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="840" y="111" width="4" height="98" rx="2" fill="#477296"/>
<text x="853" y="129" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#477296">INTERPRETATION</text>
<text x="853" y="153" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Exact ambiguity and</text>
<text x="853" y="171" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">observational instability</text>
<text x="853" y="189" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">are different</text>
</g>
<g><title>Complete finite-frequency primary comparison, integrate the new proof package into the article, then study conditioning-aware observation design.</title><rect x="840" y="241" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="840" y="241" width="4" height="98" rx="2" fill="#526357"/>
<text x="853" y="259" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#526357">INTERPRETATION</text>
<text x="853" y="283" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Next: attribution and</text>
<text x="853" y="301" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">conditioning</text>
</g>
<text x="24" y="472" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#51635b">Proof, numerical checks and novelty have separate statuses. Arrows use the relations in graph.json.</text>
<text x="24" y="493" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#51635b">Interactive companion: select a node to read assumptions, typed relationships and exact provenance.</text></svg>