<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="542" viewBox="0 0 1130 542" role="img" aria-labelledby="title desc">
<title id="title">Exact knowledge can still be thermodynamically fragile</title><desc id="desc">The current story connects exact inverse fibers to stability, without claiming that partial observation always produces ambiguity.</desc>
