<text x="682.0" y="286.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">supports</text>
<path d="M406.0,209 L406.0,241" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>motivates: Classify the complete entropy image, including bounded finite ambiguity.</title></path>
<text x="410.0" y="221.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">motivates</text>
<path d="M788,95.0 C818,95.0 810,160.0 840,160.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>supports: Even an exactly unique and stably recovered generator need not give stable entropy.</title></path>
<text x="814.0" y="123.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">supports</text>
<path d="M788,225.0 C818,225.0 810,160.0 840,160.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: Positive three-state triangles provide a local stable exception.</title></path>
<text x="814.0" y="188.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">limits</text>
<path d="M788,355.0 C818,355.0 810,160.0 840,160.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>generalizes: The fixed-count criterion separates positive triangles from all N≥4 sources.</title></path>
<text x="814.0" y="253.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">generalizes</text>
<g><title>Determine the full range of microscopic steady-state entropy production compatible with exact transition-to-transition observations.</title><rect x="24" y="111" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="111" width="4" height="98" rx="2" fill="#477296"/>
<text x="37" y="129" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#477296">DEFINITION</text>
<text x="37" y="153" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">What can one visible edge</text>
<text x="37" y="171" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">reveal?</text>
</g>
<g><title>Each detected jump resets to a known endpoint; retain the next mark and its waiting time jointly.</title><rect x="24" y="241" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="241" width="4" height="98" rx="2" fill="#477296"/>
<text x="37" y="259" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#477296">DEFINITION</text>
<text x="37" y="283" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Observe the joint kernel</text>
<text x="37" y="301" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Ψ_Q(t)</text>
</g>
<g><title>Project a compatible generator fiber through the entropy functional.</title><rect x="296" y="111" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="111" width="4" height="98" rx="2" fill="#477296"/>
<text x="309" y="129" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#477296">DEFINITION</text>
<text x="309" y="153" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">All compatible entropy</text>
<text x="309" y="171" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">values S_C(D)</text>
</g>
<g><title>The balanced theta family has unbounded, two-point, then singleton entropy fibers across an exact quartic threshold.</title><rect x="296" y="241" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="241" width="4" height="98" rx="2" fill="#157763"/>
<text x="309" y="259" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="309" y="283" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Five-state boundary:</text>
<text x="309" y="301" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">exactly two entropy values</text>
</g>
<g><title>A uniquely identified minimal-three-state tree is approached by same-trace, rate-bounded triangles with divergent entropy.</title><rect x="568" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="46" width="4" height="98" rx="2" fill="#157763"/>
<text x="581" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="581" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Identified three-state</text>
<text x="581" y="106" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">rates; divergent entropy</text>
<text x="581" y="124" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">nearby</text>
</g>
<g><title>A strictly positive three-state triangle has locally Lipschitz entropy in row TV.</title><rect x="568" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="176" width="4" height="98" rx="2" fill="#157763"/>
<text x="581" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="581" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Positive triangles: locally</text>
<text x="581" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Lipschitz entropy</text>
</g>
<g><title>For one resolved pair, a finite local entropy ceiling exists exactly at N=2 or a complete N=3 triangle.</title><rect x="568" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="306" width="4" height="98" rx="2" fill="#157763"/>
<text x="581" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="581" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Local ceiling iff N=2 or</text>
<text x="581" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">complete N=3</text>
</g>
<g><title>A source can have one or two exact entropy values while every positive observation tolerance admits arbitrarily large entropy.</title><rect x="840" y="111" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="840" y="111" width="4" height="98" rx="2" fill="#477296"/>
