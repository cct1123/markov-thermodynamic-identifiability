<text x="853" y="153" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Exact ambiguity and</text>
<text x="853" y="171" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">observational instability</text>
<text x="853" y="189" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">are different</text>
</g>
