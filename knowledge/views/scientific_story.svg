<rect width="100%" height="100%" fill="#fafaf6"/>
<text x="24" y="25" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#21372f">Exact knowledge can still be thermodynamically fragile</text>
<path d="M134.0,209 L134.0,241" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>uses_method: Specify precisely what the observer measures.</title></path>
<text x="138.0" y="221.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">uses method</text>
