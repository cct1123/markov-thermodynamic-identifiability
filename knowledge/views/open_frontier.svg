<svg xmlns="http://www.w3.org/2000/svg" width="858" height="802" viewBox="0 0 858 802" role="img" aria-labelledby="title desc">
<title id="title">What is settled—and what is still open</title><desc id="desc">The general fixed-N local-ceiling question is settled in its declared class. Exact classifications off the balanced slice and altered observation experiments remain open.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8a948f"/></marker></defs>
<rect width="100%" height="100%" fill="#fafaf6"/>
<text x="24" y="25" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#21372f">What is settled—and what is still open</text>
<path d="M406.0,176 L406.0,144" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>supports: The off-balanced family is one unresolved part of the broader exact-fiber program.</title></path>
<text x="410.0" y="156.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">supports</text>
<path d="M296,485.0 C270.0,485.0 270.0,355.0 244,355.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: The complete criterion is for one known resolved pair and the stated channel convention.</title></path>
<text x="270.0" y="416.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">limits</text>
<path d="M296,615.0 C270.0,615.0 270.0,485.0 244,485.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: Three arguments are sufficient; optimality is not claimed.</title></path>
<text x="270.0" y="546.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">limits</text>
<path d="M678.0,339 L678.0,371" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>limits: Attach exact primary comparisons and retain gaps; do not claim novelty from failed searches.</title></path>
<text x="682.0" y="351.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">limits</text>
<path d="M244,225.0 C274,225.0 266,95.0 296,95.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>leaves_open: The full balanced slice does not classify all five-/six-state observations.</title></path>
<text x="270.0" y="156.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">leaves open</text>
<path d="M244,225.0 C274,225.0 266,225.0 296,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>leaves_open: A sharp balanced ray leaves off-balanced regions unclassified.</title></path>
<text x="270.0" y="221.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">leaves open</text>
<path d="M244,485.0 C274,485.0 266,355.0 296,355.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>leaves_open: Bounded transform tests do not automatically recover stationary-window continuity without a cap.</title></path>
<text x="270.0" y="416.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">leaves open</text>
<path d="M244,485.0 C274,485.0 266,615.0 296,615.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>leaves_open: Three positive Laplace arguments suffice; their optimality is unproved.</title></path>
<text x="270.0" y="546.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">leaves open</text>
<g><title>The balanced theta family has unbounded, two-point, then singleton entropy fibers across an exact quartic threshold.</title><rect x="24" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="176" width="4" height="98" rx="2" fill="#157763"/>
<text x="37" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="37" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Five-state boundary:</text>
<text x="37" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">exactly two entropy values</text>
</g>
<g><title>For one resolved pair, a finite local entropy ceiling exists exactly at N=2 or a complete N=3 triangle.</title><rect x="24" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="306" width="4" height="98" rx="2" fill="#157763"/>
<text x="37" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="37" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Local ceiling iff N=2 or</text>
<text x="37" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">complete N=3</text>
</g>
<g><title>Every irreducible three-state source has a locally rational rate inverse with no rate priors.</title><rect x="24" y="436" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="24" y="436" width="4" height="98" rx="2" fill="#157763"/>
<text x="37" y="454" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#157763">PROVED</text>
<text x="37" y="478" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">T2 · Three-state recovery</text>
<text x="37" y="496" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">from three Laplace</text>
<text x="37" y="514" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">arguments</text>
</g>
<g><title>The repository does not classify every admissible exact entropy fiber for arbitrary five- or six-state networks with one resolved pair.</title><rect x="296" y="46" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="46" width="4" height="98" rx="2" fill="#987325"/>
<text x="309" y="64" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#987325">UNRESOLVED</text>
<text x="309" y="88" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">General five- and six-state</text>
<text x="309" y="106" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">exact fibers remain open</text>
</g>
<g><title>The full two-parameter theta(a,b) plane has proved constructive and uniqueness regions, but lacks a complete exact-fiber classification.</title><rect x="296" y="176" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="176" width="4" height="98" rx="2" fill="#987325"/>
<text x="309" y="194" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#987325">UNRESOLVED</text>
<text x="309" y="218" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Off-balanced theta</text>
<text x="309" y="236" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">classification is</text>
<text x="309" y="254" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">incomplete</text>
</g>
<g><title>At positive three-state sources, removing the common rate cap from continuity based on one stationary finite observation window has not been proved.</title><rect x="296" y="306" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="306" width="4" height="98" rx="2" fill="#987325"/>
<text x="309" y="324" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#987325">UNRESOLVED</text>
<text x="309" y="348" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Cap-free stationary-window</text>
<text x="309" y="366" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">continuity remains open</text>
</g>
<g><title>Unknown or blurred event incidence, multiple thermodynamic channels and other resolved-edge sets are outside the current complete one-pair criterion.</title><rect x="296" y="436" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="436" width="4" height="98" rx="2" fill="#987325"/>
<text x="309" y="454" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#987325">UNRESOLVED</text>
<text x="309" y="478" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Other observation and</text>
<text x="309" y="496" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">channel conventions need</text>
<text x="309" y="514" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">separate theory</text>
</g>
<g><title>Any three distinct positive Laplace arguments suffice for the local physical three-state inverse, but the minimal number of arguments has not been established.</title><rect x="296" y="566" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="296" y="566" width="4" height="98" rx="2" fill="#987325"/>
<text x="309" y="584" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#987325">UNRESOLVED</text>
<text x="309" y="608" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">The optimal number of</text>
<text x="309" y="626" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Laplace arguments is</text>
<text x="309" y="644" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">unknown</text>
</g>
<g><title>No inspected source was shown to imply the exact two-point physical entropy fiber or the complete fixed-N ceiling criterion; matching exceptional results in inaccessible originals remain a specific risk.</title><rect x="568" y="241" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="241" width="4" height="98" rx="2" fill="#987325"/>
<text x="581" y="259" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#987325">UNRESOLVED</text>
<text x="581" y="283" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">A matching prior physical</text>
<text x="581" y="301" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">theorem could change</text>
<text x="581" y="319" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">attribution</text>
</g>
<g><title>The complete manuscript is ready for expert human review. Check Appendix B&#x27;s global support exhaustion and its endpoint certificate, then finalize attribution and submission details.</title><rect x="568" y="371" width="220" height="98" rx="5" fill="white" stroke="#d4dcd5"/><rect x="568" y="371" width="4" height="98" rx="2" fill="#526357"/>
<text x="581" y="389" font-family="DejaVu Sans,sans-serif" font-size="9" font-weight="bold" fill="#526357">INTERPRETATION</text>
<text x="581" y="413" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">Next: expert review of the</text>
<text x="581" y="431" font-family="DejaVu Sans,sans-serif" font-size="13" fill="#21372f">manuscript</text>
</g>
<text x="24" y="732" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#51635b">Proof, numerical checks and novelty have separate statuses. Arrows use the relations in graph.json.</text>
<text x="24" y="753" font-family="DejaVu Sans,sans-serif" font-size="11" fill="#51635b">Interactive companion: select a node to read assumptions, typed relationships and exact provenance.</text></svg>