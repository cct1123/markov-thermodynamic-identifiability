<svg xmlns="http://www.w3.org/2000/svg" width="1402" height="542" viewBox="0 0 1402 542" role="img" aria-labelledby="title desc">
<title id="title">From microscopic rates to an entropy set</title><desc id="desc">Follow the physical chain Q → π → current → σ, alongside the observational chain Q → Ψ → model fiber → entropy identified set.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8a948f"/></marker></defs>
