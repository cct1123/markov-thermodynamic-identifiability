<text x="24" y="25" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#21372f">From microscopic rates to an entropy set</text>
<path d="M244,160.0 C274,160.0 266,160.0 296,160.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>defines: Stationary balance πQ=0 determines occupancies.</title></path>
<text x="270.0" y="156.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">defines</text>
<path d="M516,160.0 C546,160.0 538,95.0 568,95.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>defines: Weight each rate by its source occupancy.</title></path>
<text x="542.0" y="123.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">defines</text>
<path d="M244,160.0 C406.0,160.0 406.0,95.0 568,95.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>defines: Fluxes also depend on the directed rates.</title></path>
<text x="406.0" y="123.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">defines</text>
<path d="M244,160.0 C406.0,160.0 406.0,225.0 568,225.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>defines: Cycle products determine irreversible bias.</title></path>
<text x="406.0" y="188.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">defines</text>
<path d="M788,95.0 C818,95.0 810,160.0 840,160.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>defines: Entropy combines opposite fluxes and log ratios.</title></path>
<text x="814.0" y="123.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">defines</text>
<path d="M788,225.0 C818,225.0 810,160.0 840,160.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>explains: For a unicycle, current times affinity equals entropy.</title></path>
<text x="814.0" y="188.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">explains</text>
<path d="M244,160.0 C274,160.0 266,290.0 296,290.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>defines: Suppress observed jumps and propagate the killed generator.</title></path>
<text x="270.0" y="221.0" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">defines</text>
<path d="M516,290.0 C546,290.0 538,355.0 568,355.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>defines: Equal joint laws define observational equivalence.</title></path>
<text x="542.0" y="318.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">defines</text>
<path d="M788,355.0 C818,355.0 810,290.0 840,290.0" fill="none" stroke="#a0aaa5" stroke-width="1.2" marker-end="url(#arrow)"><title>defines: Collect models with the same data, quotienting only hidden relabeling.</title></path>
<text x="814.0" y="318.5" text-anchor="middle" font-family="DejaVu Sans,sans-serif" font-size="8" fill="#51635b" style="paint-order:stroke;stroke:#fafaf6;stroke-width:4px">defines</text>
